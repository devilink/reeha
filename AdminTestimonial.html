<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Reeha - Admin Testimonials</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#1a1a1a',
                        'brand-gold': '#d4af37',
                        'brand-cream': '#f5f0eb',
                        'brand-gray': '#8c8c8c',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background-color: #f9f7f2;
            color: #1a1a1a;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: white;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn-gold {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: white;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            transition: transform 0.2s, opacity 0.2s;
            cursor: pointer;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }
    </style>
    <script>
        // Simple Client-Side Password Protection
        const password = prompt("Enter Admin Password:");
        if (password !== "LabelReeha2026") {
            alert("Incorrect Password!");
            window.location.href = "index.html";
        }
    </script>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-serif font-bold text-brand-gold">Label Reeha <span
                    class="text-sm font-sans text-brand-dark uppercase tracking-widest ml-2">Admin - Testimonials</span></h1>
            <div class="flex gap-4">
                <a href="Admin.html" class="text-sm uppercase tracking-widest font-bold hover:text-brand-gold transition-colors">Manage Products</a>
                <a href="Testimonial.html" class="text-sm uppercase tracking-widest font-bold hover:text-brand-gold transition-colors">View Testimonials</a>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-6 py-12 max-w-4xl">

        <!-- Supabase Configuration Section -->
        <section class="bg-white p-8 rounded-lg shadow-md mb-12 border border-[#eaeaea]">
            <h2 class="text-2xl font-serif mb-6 flex items-center gap-3">
                <i class="fas fa-database text-brand-gold"></i> Supabase Configuration
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-500 mb-1">Project URL</label>
                    <input type="url" id="supabase-url" class="form-input" placeholder="e.g., https://yourproject.supabase.co">
                </div>
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-500 mb-1">API Key (anon or service_role)</label>
                    <input type="password" id="supabase-key" class="form-input" placeholder="Supabase Key">
                </div>
                <div class="flex justify-between items-center mt-4">
                    <p class="text-xs text-red-500 italic">* Credentials are stored locally in your browser only.</p>
                    <button id="save-config-btn" class="text-brand-gold text-sm font-bold hover:underline">Save
                        Configuration</button>
                </div>
            </div>
        </section>

        <!-- Testimonial Upload Section -->
        <section class="bg-white p-8 rounded-lg shadow-md border border-[#eaeaea] relative">
            <div id="loader" class="hidden absolute inset-0 bg-white/80 z-10 flex justify-center items-center flex-col">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-gold mb-4"></div>
                <p class="font-serif">Uploading...</p>
            </div>

            <h2 class="text-2xl font-serif mb-6 flex items-center gap-3">
                <i class="fas fa-plus text-brand-gold"></i> <span id="form-title">Add New Testimonial</span>
            </h2>

            <input type="hidden" id="edit-testimonial-id">
            <input type="hidden" id="current-image-url">

            <form id="testimonial-form" class="space-y-6">
                <!-- Image Upload -->
                <div>
                    <label class="block text-xs uppercase font-bold text-gray-500 mb-2">Client Photo</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="testimonial-image"
                            class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                                <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span>
                                </p>
                                <p class="text-xs text-gray-500">JPG, PNG (MAX. 5MB)</p>
                            </div>
                            <input id="testimonial-image" type="file" class="hidden" accept="image/*" />
                        </label>
                    </div>
                    <div id="image-preview-container" class="mt-4 hidden p-2 border rounded">
                        <p class="text-xs font-bold text-gray-500 mb-2">Preview:</p>
                        <img id="image-preview" src="" alt="Preview" class="h-40 w-auto object-contain rounded">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs uppercase font-bold text-gray-500 mb-1">Client Name</label>
                        <input type="text" id="testimonial-name" class="form-input" placeholder="e.g., Ananya S."
                            required>
                    </div>
                    <div>
                        <label class="block text-xs uppercase font-bold text-gray-500 mb-1">Designation / Location</label>
                        <input type="text" id="testimonial-designation" class="form-input" placeholder="e.g., Principal - Dhubri Medical College" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase font-bold text-gray-500 mb-1">Quote</label>
                    <textarea id="testimonial-quote" class="form-input" rows="4" placeholder="e.g., Purely handcrafted and extremely lightweight..." required></textarea>
                </div>

                <div class="pt-4 border-t mt-4 flex justify-between items-center">
                    <button type="button" id="cancel-edit-btn"
                        class="hidden text-gray-500 hover:text-gray-800 text-sm font-bold">Cancel Edit</button>
                    <button type="submit" id="submit-btn" class="btn-gold shadow-lg shadow-orange-100">
                        Upload Testimonial <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </form>
        </section>

        <!-- Testimonial List Section -->
        <section class="bg-white p-8 rounded-lg shadow-md border border-[#eaeaea] mt-12">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-serif flex items-center gap-3">
                    <i class="fas fa-list text-brand-gold"></i> Testimonial List
                </h2>
                <button onclick="fetchTestimonials()" class="text-sm font-bold text-gray-500 hover:text-brand-gold"><i
                        class="fas fa-sync-alt mr-1"></i> Refresh</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs uppercase text-gray-400 border-b">
                            <th class="py-3">Photo</th>
                            <th class="py-3">Name</th>
                            <th class="py-3">Quote</th>
                            <th class="py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="testimonial-list-body">
                        <!-- Items rendered here -->
                        <tr>
                            <td colspan="4" class="text-center py-4 text-gray-400">Loading or empty...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // --- 1. CONFIGURATION LODING/SAVING ---
        const fields = ['supabase-url', 'supabase-key'];

        function loadConfig() {
            fields.forEach(field => {
                const val = localStorage.getItem(field);
                if (val) document.getElementById(field).value = val;
            });
        }

        document.getElementById('save-config-btn').addEventListener('click', () => {
            fields.forEach(field => {
                const val = document.getElementById(field).value;
                if (val) localStorage.setItem(field, val);
            });
            alert("Configuration Saved!");
            location.reload();
        });

        // Initialize Config
        loadConfig();
        
        const S_URL = document.getElementById('supabase-url').value;
        const S_KEY = document.getElementById('supabase-key').value;
        let supabase;
        if (S_URL && S_KEY) {
            supabase = window.supabase.createClient(S_URL, S_KEY);
        }


        // --- 2. IMAGE PREVIEW ---
        const imageInput = document.getElementById('testimonial-image');
        const previewContainer = document.getElementById('image-preview-container');
        const previewImage = document.getElementById('image-preview');

        imageInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // --- 3. FETCH & LIST LOGIC ---
        async function fetchTestimonials() {
            if (!supabase) {
                return;
            }

            const listBody = document.getElementById('testimonial-list-body');

            try {
                const { data: items, error } = await supabase
                    .from('testimonials')
                    .select('*')
                    .order('createdAt', { ascending: false });

                if (error) throw error;

                listBody.innerHTML = '';
                if (!items || items.length === 0) {
                    listBody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-gray-400">No testimonials found.</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const quotePreview = item.quote ? (item.quote.substring(0, 50) + '...') : '';
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50 transition-colors';
                    row.innerHTML = `
                        <td class="py-3"><img src="${item.imageUrl}" class="w-12 h-12 object-cover rounded border"></td>
                        <td class="py-3 font-medium">${item.name}<br><span class="text-xs text-gray-500">${item.designation}</span></td>
                        <td class="py-3 text-sm italic">"${quotePreview}"</td>
                        <td class="py-3 text-right space-x-2">
                            <button class="text-blue-500 hover:text-blue-700" onclick='initEdit(${JSON.stringify(item)})'><i class="fas fa-edit"></i></button>
                            <button class="text-red-500 hover:text-red-700" onclick="deleteTestimonial('${item.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    listBody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                listBody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-red-500">Error: ${err.message}</td></tr>`;
            }
        }

        // --- 4. DELETE LOGIC ---
        async function deleteTestimonial(id) {
            if (!confirm("Are you sure you want to delete this testimonial?")) return;

            try {
                const { error } = await supabase.from('testimonials').delete().eq('id', id);
                if (error) throw error;
                alert("Testimonial deleted!");
                fetchTestimonials();
            } catch (err) {
                alert("Error deleting: " + err.message);
            }
        }

        // --- 5. EDIT MODE LOGIC ---
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-edit-btn');
        const editIdInput = document.getElementById('edit-testimonial-id');
        const currentUrlInput = document.getElementById('current-image-url');

        function initEdit(item) {
            // Populate Form
            document.getElementById('testimonial-name').value = item.name;
            document.getElementById('testimonial-designation').value = item.designation;
            document.getElementById('testimonial-quote').value = item.quote;

            // Set Hidden Inputs
            editIdInput.value = item.id;
            currentUrlInput.value = item.imageUrl;

            // Show Preview
            previewImage.src = item.imageUrl;
            previewContainer.classList.remove('hidden');

            // UI Changes
            formTitle.innerText = "Edit Testimonial";
            submitBtn.innerHTML = 'Update Testimonial <i class="fas fa-save ml-2"></i>';
            cancelBtn.classList.remove('hidden');

            // Scroll to form
            document.getElementById('testimonial-form').scrollIntoView({ behavior: 'smooth' });
        }

        cancelBtn.addEventListener('click', resetForm);

        function resetForm() {
            document.getElementById('testimonial-form').reset();
            editIdInput.value = '';
            currentUrlInput.value = '';
            previewContainer.classList.add('hidden');
            formTitle.innerText = "Add New Testimonial";
            submitBtn.innerHTML = 'Upload Testimonial <i class="fas fa-arrow-right ml-2"></i>';
            cancelBtn.classList.add('hidden');
        }

        // --- 6. CREATE / UPDATE LOGIC ---
        document.getElementById('testimonial-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!supabase) {
                alert('Please fill in Supabase Configuration first!');
                return;
            }

            // Data
            const file = imageInput.files[0];
            const name = document.getElementById('testimonial-name').value;
            const designation = document.getElementById('testimonial-designation').value;
            const quote = document.getElementById('testimonial-quote').value;

            const isEdit = !!editIdInput.value;
            const testimonialId = isEdit ? editIdInput.value : 'testi_' + Date.now();
            let imageUrl = isEdit ? currentUrlInput.value : '';

            // Validation: New items need image, Edits act optionally
            if (!isEdit && !file) {
                alert('Please select an image!');
                return;
            }

            // Show Loader
            document.getElementById('loader').classList.remove('hidden');

            try {
                // 1. Upload Image (If selected)
                if (file) {
                    const fileName = `testimonials/${testimonialId}_${file.name}`;
                    const { error: uploadError } = await supabase.storage
                        .from('label-reeha-images')
                        .upload(fileName, file, { upsert: true });

                    if (uploadError) throw uploadError;

                    const { data: publicUrlData } = supabase.storage
                        .from('label-reeha-images')
                        .getPublicUrl(fileName);
                    
                    imageUrl = publicUrlData.publicUrl;
                }

                // 2. Put Item in Postgres
                const item = {
                    id: testimonialId,
                    name: name,
                    designation: designation,
                    quote: quote,
                    imageUrl: imageUrl
                };

                if (!isEdit) item.createdAt = new Date().toISOString();

                const { error: dbError } = await supabase
                    .from('testimonials')
                    .upsert(item);

                if (dbError) throw dbError;

                // Success
                alert(isEdit ? 'Testimonial updated!' : 'Testimonial uploaded!');
                resetForm();
                fetchTestimonials(); // Refresh list

            } catch (err) {
                console.error('Error:', err);
                alert('An error occurred: ' + err.message);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        });

        // Initial Fetch
        fetchTestimonials();

    </script>
</body>

</html>
